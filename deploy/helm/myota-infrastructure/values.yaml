imagePullPolicy: IfNotPresent
postgresSecret: myota-postgres-auth
storageClassName: ''
# Bounded single-instance PostgreSQL profile used by the launch topology.
resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: '1', memory: 2Gi }
objectStorage:
  enabled: false
  image: chrislusf/seaweedfs:latest@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
  provisionerImage: ''
  configSecretName: myota-seaweedfs-s3-config
  credentialsSecretName: myota-object-storage
  storage: 20Gi
  storageClassName: ''
  buckets:
    - myota-user-profile-images
    - myota-adif
    - myota-award-assets
    - myota-award-signatures
    - myota-certificates
    - myota-geodata-imports
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: '2', memory: 2Gi }

# Keep exactly these three databases. Email delivery is owned by Core.
databases:
  core:
    name: myota_core
    image: ''
    storage: 10Gi
  activity:
    name: myota_activity
    image: ''
    storage: 20Gi
  geo:
    name: myota_geo
    image: ''
    storage: 50Gi
