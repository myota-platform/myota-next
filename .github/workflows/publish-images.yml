name: Publish NestJS images

on:
  pull_request:
    branches: [main, testing]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Release source quality checks
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm ci --prefix web/admin
      - run: npm run lint --prefix web/admin
      - run: npm run typecheck --prefix web/admin
      - run: npm run build --prefix web/admin

  verify-images:
    name: Build and scan ${{ matrix.app }} image
    if: github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app:
          - postgres
          - postgis
          - nats
          - gateway
          - identity
          - identity-maintenance
          - programmes
          - activity
          - activity-worker
          - activity-notifications
          - geodata
          - geodata-worker
          - geodata-importer
          - email-worker
          - outbox-worker
          - tools
          - admin-web
          - participant-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set image build arguments
        id: image-build-args
        env:
          IMAGE_NAME: ${{ matrix.app }}
        run: |
          case "$IMAGE_NAME" in
            postgres|postgis|nats|tools|admin-web|participant-web) ;;
            *) printf 'value=APP_NAME=%s\n' "$IMAGE_NAME" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Select image build target
        id: image-target
        env:
          IMAGE_NAME: ${{ matrix.app }}
        run: |
          case "$IMAGE_NAME" in
            postgres|postgis) printf 'value=%s\n' "$IMAGE_NAME" >> "$GITHUB_OUTPUT" ;;
            geodata-worker) printf 'value=geodata-worker\n' >> "$GITHUB_OUTPUT" ;;
            *) printf 'value=\n' >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.app == 'participant-web' && './web/participant' || '.' }}
          file: ${{ (matrix.app == 'postgres' || matrix.app == 'postgis') && 'deploy/images/database/Dockerfile' || matrix.app == 'nats' && 'deploy/images/nats/Dockerfile' || matrix.app == 'tools' && 'deploy/Dockerfile.tools' || matrix.app == 'admin-web' && 'web/admin/Dockerfile' || matrix.app == 'participant-web' && 'web/participant/Dockerfile' || 'Dockerfile' }}
          build-args: ${{ steps.image-build-args.outputs.value }}
          target: ${{ steps.image-target.outputs.value }}
          push: false
          load: true
          tags: local/myota-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
      - name: Scan built image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: local/myota-${{ matrix.app }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  publish:
    name: Publish ${{ matrix.app }} release image
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [quality, verify-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # Required to publish the release images to GHCR.
      attestations: write # Required to record provenance attestations.
      id-token: write # Required by the build action for keyless provenance.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app:
          - postgres
          - postgis
          - nats
          - gateway
          - identity
          - identity-maintenance
          - programmes
          - activity
          - activity-worker
          - activity-notifications
          - geodata
          - geodata-worker
          - geodata-importer
          - email-worker
          - outbox-worker
          - tools
          - admin-web
          - participant-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
      - name: Set image build arguments
        id: image-build-args
        env:
          IMAGE_NAME: ${{ matrix.app }}
        run: |
          case "$IMAGE_NAME" in
            postgres|postgis|nats|tools|admin-web|participant-web) ;;
            *) printf 'value=APP_NAME=%s\n' "$IMAGE_NAME" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Select image build target
        id: image-target
        env:
          IMAGE_NAME: ${{ matrix.app }}
        run: |
          case "$IMAGE_NAME" in
            postgres|postgis) printf 'value=%s\n' "$IMAGE_NAME" >> "$GITHUB_OUTPUT" ;;
            geodata-worker) printf 'value=geodata-worker\n' >> "$GITHUB_OUTPUT" ;;
            *) printf 'value=\n' >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.app == 'admin-web' && './web/admin' || matrix.app == 'participant-web' && './web/participant' || '.' }}
          file: ${{ (matrix.app == 'postgres' || matrix.app == 'postgis') && 'deploy/images/database/Dockerfile' || matrix.app == 'nats' && 'deploy/images/nats/Dockerfile' || matrix.app == 'tools' && 'deploy/Dockerfile.tools' || matrix.app == 'admin-web' && 'web/admin/Dockerfile' || matrix.app == 'participant-web' && 'web/participant/Dockerfile' || 'Dockerfile' }}
          build-args: ${{ steps.image-build-args.outputs.value }}
          target: ${{ steps.image-target.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: mode=max
          sbom: true
      - name: Record image digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
