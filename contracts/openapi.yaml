  /v1/identity/internal/email-recipients/{accountId}:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Resolve a deliverable email address for the email service
      description: >-
        Internal service-to-service route. Only an `email-service` token with
        the fixed `identity.email.resolve` scope and Identity audience is
        accepted; revoked service tokens are rejected. The public Gateway
        rejects `/v1/identity/internal/` paths. Active accounts are eligible
        for configured email templates. A pending-setup account is eligible
        only when `templateId` is `participant-email-verification.v1` and its
        address remains unverified. `password-reset.v1` can resolve only an
        active account with a verified address. Password reset tokens are
        created only for the authenticated delivery attempt, stored as a hash,
        and returned transiently to the email worker. Malformed identifiers,
        missing, other
        pending-setup, deactivated, and unaddressable accounts share the same 404.
        Returns only the deliverable address; no account object or profile
        fields are returned. The address must not be logged or placed in NATS.
      operationId: getEmailRecipientAddress
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
        - in: query
          name: templateId
          required: false
          description: >-
            Email template being delivered. Required to resolve an unverified
            pending-setup account for its verification message.
          schema:
            type: string
            enum:
              - account-created-participant.v1
              - account-created-administrator.v1
              - participant-email-verification.v1
              - password-reset.v1
              - participant-email-change-old.v1
              - participant-email-change-new.v1
              - participant-email-change-complete-old.v1
              - participant-email-change-complete-new.v1
        - in: query
          name: contextId
          required: false
          description: >-
            Required for password-reset delivery and email-change notices. It
            binds transient link creation to the still-current recovery request
            or pending email-change operation.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current deliverable address for this account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailRecipientAddress' }
        '401': { description: Service authentication required }
        '403': { description: Email recipient resolution scope required }
        '404': { description: Recipient is unavailable }
