openapi: 3.1.0
info:
  title: MyOTA Outdoor Activation Platform APIs
  version: 1.0.0
  description: >-
    Service contracts for a programme-agnostic amateur-radio outdoor activation platform.
    All platform operation times, publication effective dates, QSOs, audit events,
    logs and observability use UTC. Canonical API date-times carry Z or an explicit
    UTC offset; timezone-bearing inputs are normalized to UTC. Legacy unqualified
    date-times are interpreted as UTC, never the server or browser local timezone.
    Error responses use the Problem schema and include X-Request-ID and
    X-Correlation-ID response headers. The Gateway forwards W3C trace context
    headers to API services and returns upstream trace headers when provided.
    X-Trace-ID matches the request ID used by Nest observability.
servers:
  - url: http://localhost:8080
tags:
  - name: Identity
  - name: Programmes
  - name: Geodata
  - name: Activity
  - name: Awards
paths:
  /v1/identity/auth/register:
    post:
      tags: [Identity]
      summary: Create a pending participant account and send an email verification link
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/RegisterAccount' } },
          }
      responses:
        '200':
          {
            description: Generic response that does not reveal whether the email is already registered,
          }
        '400': { description: Invalid registration data or rate limit exceeded }
        '503': { description: Registration email delivery is not configured }
  /v1/identity/auth/register/resend:
    post:
      tags: [Identity]
      summary: Resend a participant verification email without disclosing account existence
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/RegistrationResend' } },
          }
      responses:
        '200':
          {
            description: Generic response that does not reveal whether the email is registered,
          }
        '400': { description: Invalid email or rate limit exceeded }
  /v1/identity/auth/register/verify:
    post:
      tags: [Identity]
      summary: Verify a participant email address with a single-use token
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/EmailVerification' } },
          }
      responses:
        '200': { description: Email verified and participant account activated }
        '400': { description: Token is invalid, expired, or already used }
  /v1/identity/auth/login:
    post:
      tags: [Identity]
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/Login' } },
          }
      responses: { '200': { description: Authenticated } }
  /v1/identity/auth/refresh:
    post:
      tags: [Identity]
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/RefreshToken' } },
          }
      responses: { '200': { description: Rotated session } }
  /v1/identity/auth/logout:
    post:
      tags: [Identity]
      summary: Revoke a session or access token
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/RefreshToken' } },
          }
      responses: { '200': { description: Logged out } }
  /v1/identity/auth/recovery/request:
    post:
      tags: [Identity]
      summary: Request a password reset email without disclosing account existence
      description: >-
        The response is generic for unknown, unverified, inactive, and eligible
        accounts. Eligible accounts receive a single-use link that expires
        after 30 minutes. Requests are limited by normalized email and client
        address. Reset tokens are hashed at rest and never returned by the
        public API in production.
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/RecoveryRequest' } },
          }
      responses:
        '200':
          {
            description: Generic acceptance response; does not disclose account existence,
          }
        '400': { description: Invalid email address }
        '503': { description: Recovery email delivery is not configured }
  /v1/identity/auth/recovery/reset:
    post:
      tags: [Identity]
      summary: Set a new password using a single-use recovery token
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/RecoveryReset' } },
          }
      responses: { '200': { description: Password reset } }
  /v1/identity/me/email-change:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Read the authenticated participant's pending email change
      responses:
        '200':
          description: Pending change and both verification states
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChangeStatus' }
    post:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Request an email change requiring current-password and dual-email verification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeRequest' }
      responses:
        '200':
          description: Verification request accepted
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/EmailChangeRequestAccepted' }
        '400':
          {
            description: Invalid details,
            incorrect current password,
            or unavailable address,
          }
    delete:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Cancel the authenticated participant's pending email change
      responses:
        '200':
          description: Pending change cancelled or absent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChangeCancellation' }
  /v1/identity/me/email-change/resend:
    post:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Restart verification for the authenticated participant's pending email change
      description: >-
        Invalidates links from the previous pending operation and queues new
        confirmations for both the current and proposed addresses. The
        participant must confirm both new links. The account's current email
        remains authoritative until then.
      responses:
        '200':
          description: Verification restarted or no pending change exists
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [verification_resent, no_pending_change]
        '400':
          {
            description: New address is no longer available or resend is throttled,
          }
  /v1/identity/auth/email-change/verify:
    post:
      tags: [Identity]
      summary: Confirm one address for a pending email change
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeVerify' }
      responses:
        '200':
          description: Address confirmed or email change completed
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/EmailChangeVerificationOutcome' }
        '400':
          { description: Invalid, expired, cancelled, or already used link }
  /v1/identity/me:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Get the authenticated account and scopes
      responses: { '200': { description: Authenticated account } }
  /v1/identity/me/profile:
    patch:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Update the authenticated account's private profile fields
      operationId: patchIdentityProfile
      description: >-
        Only the authenticated account can update its own website and biography.
        The biography is returned as Markdown source; clients must render a safe
        Markdown subset, strip raw HTML, and sanitize links. Profile fields are
        private by default and are not exposed through anonymous public reads.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountProfileUpdate' }
      responses:
        '200': { description: Updated profile fields }
        '400': { description: Invalid profile fields }
        '403':
          {
            description: Authentication is missing or the caller is not the account owner,
          }
  /v1/identity/me/profile-image:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Read the authenticated account's private profile image
      operationId: getIdentityProfileImage
      description: Returns a normalized WebP image with private, no-store caching. No public or signed storage URL is issued.
      responses:
        '200':
          description: Normalized private profile image
          content: { image/webp: { schema: { type: string, format: binary } } }
        '403': { description: Authentication is required }
        '404': { description: No profile image is set }
    put:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Upload or replace the authenticated account's profile image
      operationId: putIdentityProfileImage
      description: >-
        Upload raw JPEG, PNG, or WebP bytes (not multipart). Identity validates
        decoded content, rejects animation, SVG and unsafe dimensions, crops and
        resizes to a square 512 by 512 WebP, strips metadata, and stores the
        result in the private Identity profile-image bucket. Input is limited
        to 5 MiB and 4096 by 4096 pixels; output is limited to 256 KiB. Reads
        remain authenticated through this API; bucket names, object keys,
        credentials, and permanent URLs are never returned.
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '200':
          {
            description: Profile image uploaded or replaced,
            including safe image metadata,
          }
        '400':
          {
            description: Malformed,
            animated,
            unsafe,
            or unsupported image content,
          }
        '403': { description: Authentication is required }
        '413': { description: Input exceeds 5 MiB }
    delete:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Remove the authenticated account's profile image
      operationId: deleteIdentityProfileImage
      responses:
        '200':
          {
            description: Profile image reference cleared; object cleanup is retried by Identity maintenance,
          }
        '403': { description: Authentication is required }
  /v1/identity/accounts/{accountId}/profile-image:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Read an account profile image as the owner or an Identity administrator
      operationId: getAccountProfileImage
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      description: Authenticated owner or Identity administrator only. Returns private, no-store WebP bytes; no public URL or storage credential is issued.
      responses:
        '200':
          description: Normalized private profile image
          content: { image/webp: { schema: { type: string, format: binary } } }
        '403':
          {
            description: Caller is not the account owner or an Identity administrator,
          }
        '404': { description: Account or profile image not found }
  /v1/identity/admin/accounts:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: List accounts for global identity administrators
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses: { '200': { description: Account page } }
  /v1/identity/admin/participants:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: List participant-only accounts for delegated participant administrators
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Participant account page }
        '403': { description: Participant account management scope is required }
  /v1/identity/admin/participants/{accountId}:
    patch:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Update an allowed participant field or suspend/reactivate the account
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema: { $ref: '#/components/schemas/ParticipantAdminUpdate' },
              },
          }
      responses:
        '200': { description: Updated participant account }
        '400': { description: Unsupported field or status transition }
        '403': { description: Participant account management scope is required }
        '404': { description: Participant account not found }
  /v1/identity/admin/roles:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: List built-in and custom administrative roles and permissions
      description: >-
        Requires identity.admin, identity.accounts.create,
        identity.roles.assign, or identity.roles.manage. Account creators use
        this non-personal role catalogue to show only roles they may grant.
      responses:
        '200': { description: Role catalogue }
        '403': { description: Missing role-catalogue access }
    post:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Create a custom administrative role
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/AdminRoleDefinition' } },
          }
      responses: { '201': { description: Created role definition } }
  /v1/identity/roles:
    post:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Create a custom administrative role
      operationId: createIdentityRole
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/AdminRoleDefinition' } },
          }
      responses: { '201': { description: Created role definition } }
  /v1/identity/admin/security-events:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: List security events for global identity administrators
      operationId: listSecurityEvents
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses: { '200': { description: Security-event page } }
  /v1/identity/accounts:
    post:
      tags: [Identity]
      summary: Create a participant account; role grants require separate authority
      operationId: createAccount
      security: [{ bearerAuth: [] }]
      description: >-
        Requires identity.accounts.create. Every new account receives the
        participant role and remains pending credential setup. This operation
        does not send an invitation; invitation delivery and credential setup
        are not available yet. Clients must show the pending setup state and
        must not claim that an invitation was sent. Supplying any additional
        role requires identity.roles.assign and each granted role must be
        strictly below the actor's current authority. Permanent passwords and
        client-supplied permission scopes are not accepted. Repeating a request
        with the same Idempotency-Key replays the original result; a duplicate
        email without a prior idempotent result is rejected.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccount' }
      responses:
        '201':
          description: Created
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/Account' } },
            }
        '400': { description: Invalid account data or duplicate email address }
        '401': { description: Missing or invalid authentication }
        '403': { description: Missing account-create or role-grant authority }
  /v1/identity/accounts/{accountId}/callsigns:
    post:
      tags: [Identity]
      summary: Add and optionally verify a callsign
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCallsign' }
      responses:
        '201': { description: Created }
  /v1/identity/accounts/{accountId}/callsigns/{callsignId}/evidence:
    post:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Submit callsign verification evidence
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/CallsignId'
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/CallsignEvidence' } },
          }
      responses: { '201': { description: Evidence submitted } }
  /v1/identity/accounts/{accountId}/callsigns/{callsignId}/verify:
    post:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Verify callsign evidence using the callsign.verify scope
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/CallsignId'
      responses: { '200': { description: Callsign verified } }
  /v1/identity/accounts/{accountId}/roles:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses: { '200': { description: Account roles } }
  /v1/identity/accounts/{accountId}/export:
    get:
      tags: [Identity]
      operationId: exportAccount
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses: { '200': { description: Personal data export } }
  /v1/programmes:
    get:
      tags: [Programmes]
      summary: List configured programmes
      responses:
        '200': { description: Programme list }
    post:
      tags: [Programmes]
      summary: Create a programme configuration
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Programme' }
      responses: { '201': { description: Created } }
  /v1/programmes/{slug}/policy:
    get:
      tags: [Programmes]
      summary: Get effective programme rules, entity types, and numbering policy
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Effective programme policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgrammePolicy' }
  /v1/entity-types:
    get:
      tags: [Programmes]
      security: [{ bearerAuth: [] }]
      summary: List shared entity category master data
      responses: { '200': { description: Shared entity category catalogue } }
    post:
      tags: [Programmes]
      security: [{ bearerAuth: [] }]
      summary: Create or update a shared entity category definition
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/EntityType' } },
          }
      responses:
        {
          '200': { description: Updated category },
          '201': { description: Created category },
        }
  /v1/programmes/{slug}/entity-types:
    get:
      tags: [Programmes]
      security: [{ bearerAuth: [] }]
      summary: List entity categories assigned to the programme
      parameters:
        [{ in: path, name: slug, required: true, schema: { type: string } }]
      responses: { '200': { description: Entity category catalogue } }
    post:
      tags: [Programmes]
      security: [{ bearerAuth: [] }]
      summary: Legacy category upsert and assignment compatibility endpoint
      parameters:
        [
          { in: path, name: slug, required: true, schema: { type: string } },
          { $ref: '#/components/parameters/IdempotencyKey' },
        ]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/EntityType' } },
          }
      responses:
        {
          '200': { description: Updated category },
          '201': { description: Created category },
        }
  /v1/geodata/entities:
    get:
      tags: [Geodata]
      summary: List verified and candidate entities
      parameters:
        - in: query
          name: programme
          schema: { type: string }
        - in: query
          name: programmeUnassigned
          description: >-
            Set to true to return only entities with no programme assignment.
            Cannot be combined with programme.
          schema: { type: boolean, default: false }
        - in: query
          name: status
          description: Repeat or comma-separate values for a multi-status filter; omit for all statuses.
          style: form
          explode: true
          schema:
            {
              type: array,
              items:
                {
                  type: string,
                  enum: [CANDIDATE, APPROVED, RETIRED, REJECTED],
                },
            }
        - { in: query, name: entityType, schema: { type: string } }
        - { in: query, name: continent, schema: { type: string } }
        - { in: query, name: country, schema: { type: string } }
        - {
            in: query,
            name: region,
            description: Provider-derived first subdivision / region name.,
            schema: { type: string },
          }
        - { in: query, name: province, schema: { type: string } }
        - {
            in: query,
            name: city,
            description: Matches either city or municipality.,
            schema: { type: string },
          }
        - { in: query, name: minLon, schema: { type: number, format: double } }
        - { in: query, name: minLat, schema: { type: number, format: double } }
        - { in: query, name: maxLon, schema: { type: number, format: double } }
        - { in: query, name: maxLat, schema: { type: number, format: double } }
        - {
            in: query,
            name: bbox,
            description: Map filter as minLon,
            minLat,
            maxLon,
            maxLat. Used when no legacy individual bounds are supplied; if any individual bound is supplied,
            the individual bounds take precedence.,
            schema:
              {
                type: string,
                pattern: '^-?\\d+(\\.\\d+)?,-?\\d+(\\.\\d+)?,-?\\d+(\\.\\d+)?,-?\\d+(\\.\\d+)?$',
              },
          }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Entity list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GeoEntity' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  nextPage: { type: integer, nullable: true }
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Create one Geodata candidate synchronously
      description: Creates and audits one manual candidate in a transaction. Identifier allocation and reservation are committed with the entity. Bulk sources must use the asynchronous import workflow.
      operationId: createManualGeodataEntity
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, programmeSlug, entityTypeCodes, geometry]
              properties:
                name: { type: string, minLength: 1, maxLength: 240 }
                programmeSlug: { type: string }
                entityTypeCodes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string }
                geometry: { type: object, description: GeoJSON Geometry }
                location: { type: object }
                website: { type: string, nullable: true }
                description: { type: string, nullable: true }
                jurisdiction: { type: string, nullable: true }
                qualifier: { type: string }
                serial: { type: string }
      responses:
        '201':
          { description: Candidate created and identifier assigned atomically }
        '400':
          { description: Invalid entity fields, geometry, or numbering policy }
        '409':
          {
            description: Identifier was assigned concurrently; retry with a new suggestion,
          }
  /v1/geodata/entity-id-preview:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Preview the next programme entity ID
      operationId: previewManualGeodataEntityId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [programmeSlug, entityTypeCode]
              properties:
                programmeSlug: { type: string }
                entityTypeCode: { type: string }
                location: { type: object }
                qualifier: { type: string }
      responses:
        '200': { description: Non-reserving identifier preview }
        '400': { description: Invalid scope or missing qualifier }
  /v1/geodata/entity-programme-assignment-preview:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Preview a synchronous assignment of existing entities to a programme
      operationId: previewGeodataProgrammeEntityAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: '#/components/schemas/GeodataProgrammeAssignmentPreviewRequest',
              }
      responses:
        '200':
          { description: Ordered assignment and immutable entity ID preview }
        '400':
          {
            description: Invalid selection or entities are not eligible for the programme,
          }
        '403':
          {
            description: Caller lacks administration coverage for the target programme,
          }
        '409':
          {
            description: An entity already has programme membership or an identifier,
          }
  /v1/geodata/entity-programme-assignments:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Synchronously assign selected existing entities and reserve their programme IDs atomically
      description: >-
        This bounded command is synchronous and all-or-nothing. It accepts at
        most 500 approved, currently unassigned entities. Category membership
        alone never assigns an entity to a programme. The identifier preview
        must be submitted unchanged; stale or conflicting previews are rejected.
      operationId: assignGeodataEntitiesToProgramme
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: '#/components/schemas/GeodataProgrammeAssignmentRequest' }
      responses:
        '200':
          { description: All selected entities assigned with permanent IDs }
        '400': { description: Invalid selection or numbering policy }
        '401': { description: Missing or invalid authentication }
        '403':
          {
            description: Caller lacks administration coverage for the target programme,
          }
        '409':
          {
            description: Selection or ID preview changed; the transaction made no changes,
          }
        '503': { description: Programme configuration is unavailable }

  /v1/geodata/imports:
    get:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: List geodata import runs
      responses: { '200': { description: Import runs } }
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Create a geodata import resource and queue candidate preprocessing
      description: Accepts a JSON feature collection or text document, or a durable object-storage reference. Persistent deployments reject single-request multipart uploads; use the resumable upload session endpoints instead. All accepted sources enter the preprocessing queue before promotion.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            {
              schema:
                {
                  oneOf:
                    [
                      { $ref: '#/components/schemas/GeoImport' },
                      { $ref: '#/components/schemas/GeoImportObjectReference' },
                    ],
                },
            }
          multipart/form-data:
            { schema: { $ref: '#/components/schemas/GeoImportMultipart' } }
      responses:
        '202': { description: Import accepted }
        '400':
          {
            description: Invalid request,
            oversized body,
            or single-request multipart uploads are disabled,
          }
  /v1/geodata/imports/{runId}:
    get:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Get geodata import status and summary
      parameters:
        - {
            in: path,
            name: runId,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Import status, processing counts, source manifest, and errors
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/GeoImportRun' } },
            }
        '404': { description: Import run not found }
  /v1/geodata/imports/{runId}/cancellation:
    put:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Cancel a queued upload or request cancellation of active preprocessing
      description: Idempotently creates the cancellation resource for an import run. QUEUED and UPLOAD_PENDING runs become CANCELLED immediately; PROCESSING runs become CANCELLING and stop at a worker checkpoint. Preprocessed runs cannot be cancelled because review begins at that point. Cancellation removes staged records and temporary source bytes.
      parameters:
        - {
            in: path,
            name: runId,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Import cancelled, or cancellation was already complete
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/GeoImportRun' } },
            }
        '202':
          description: Cancellation requested; the worker will stop at a safe checkpoint
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/GeoImportRun' } },
            }
        '400':
          {
            description: Import has passed the preprocessing stage or cannot be cancelled,
          }
        '404': { description: Import run not found }
  /v1/geodata/imports/{runId}/candidates:
    get:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: List the paged pre-processed records for an import run
      description: Pre-processed records are not entities yet. They remain invisible to the entity catalogue until confirmed and promoted.
      parameters:
        - {
            in: path,
            name: runId,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged pending pre-processed import records; confirmed, rejected, and processed staging records are omitted
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: '#/components/schemas/GeoImportCandidatePage' },
                },
            }
  /v1/geodata/imports/{runId}/candidates/{candidateId}/entity-id-suggestion:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Suggest the next available manual entity ID serial
      description: Returns an advisory, non-reserving suggestion for the candidate's programme and qualifier scope. Promotion rechecks uniqueness atomically; another administrator may claim the suggestion first.
      parameters:
        - {
            in: path,
            name: runId,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: path,
            name: candidateId,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                qualifier: { type: string }
      responses:
        '200':
          description: Existing stable ID or the next available manual assignment suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeoEntityIdSuggestion' }
        '400':
          { description: No manual numbering policy or qualifier is invalid }
        '404': { description: Candidate does not belong to the import run }
  /v1/geodata/imports/{runId}/candidates/validate:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Confirm or reject selected pre-processed records for promotion
      parameters:
        - {
            in: path,
            name: runId,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: '#/components/schemas/GeoImportCandidateValidation' },
              },
          }
      responses:
        {
          '200':
            {
              description: Selected records confirmed or rejected; rejected records are deleted from staging,
            },
        }
  /v1/geodata/imports/{runId}/process:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Promote selected import candidates atomically
      description: Promote up to 300 pending or confirmed candidates synchronously. The complete selection is validated and committed in one Geodata transaction, or the entire request is rejected. The target is explicitly CANDIDATE or APPROVED.
      parameters:
        - {
            in: path,
            name: runId,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: '#/components/schemas/GeoImportProcessingRequest' },
              },
          }
      responses:
        '200':
          description: All selected candidates were promoted and durable entity/outbox state was committed
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: '#/components/schemas/GeoImportProcessingResult' },
                },
            }
        '400':
          {
            description: Invalid,
            over-limit,
            or ineligible selection; no candidate is promoted,
          }
  /v1/geodata/imports/{runId}/processing-queues/{queueId}:
    get:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Read the outcome of an import promotion queue
      description: Returns terminal state and per-candidate outcomes for a queue belonging to this import run. Failed candidates may be retried through the process operation after the failed result is observed.
      parameters:
        - {
            in: path,
            name: runId,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: path,
            name: queueId,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Current promotion queue state and candidate outcomes
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: '#/components/schemas/GeoImportProcessingQueue' },
                },
            }
        '403': { description: geodata.import scope required }
        '404': { description: Queue not found for this import run }
  /v1/geodata/imports/{runId}/processing-queues/{queueId}/redrive:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Redrive a failed import promotion queue
      description: Requeues the original candidate set, resets the worker retry count, and records the authenticated administrator and required reason in queue metadata. Processed candidates are handled idempotently by the worker.
      parameters:
        - {
            in: path,
            name: runId,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: path,
            name: queueId,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: '#/components/schemas/GeoImportProcessingRedrive' },
              },
          }
      responses:
        '202': { description: Failed queue requeued for processing }
        '400': { description: Queue is not failed or redrive reason is invalid }
        '403': { description: geodata.import scope required }
        '404': { description: Queue not found for this import run }
  /v1/geodata/imports/{runId}/processed:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Finalize an import and discard staged records
      description: Idempotently removes the run's pre-processed candidate and promotion-queue rows while preserving the import summary and any already materialized entities.
      parameters:
        - {
            in: path,
            name: runId,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema: { $ref: '#/components/schemas/GeoImportFinalization' },
              },
          }
      responses:
        '200':
          description: Import finalized and staged records discarded
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/GeoImportRun' } },
            }
  /v1/geodata/load-test-runs/{testRunId}:
    delete:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Clean up a tagged geodata load-test run
      description: Available only when cleanup is explicitly enabled in a declared environment. Production additionally requires a separate production-cleanup acknowledgement. Requires a bearer token with GLOBAL_ADMIN or GLOBAL_OPERATOR role and exact confirmation. Removes only tagged import runs, their candidates and queues, uploaded source objects, and entities created by those runs. Refuses active runs, objects outside the geodata import bucket, and entities with QSO, activation, or award-progress impact.
      operationId: deleteGeodataLoadTestRun
      parameters:
        - {
            in: path,
            name: testRunId,
            required: true,
            schema:
              {
                type: string,
                pattern: '^lt-[A-Za-z0-9._-]{1,77}$',
                maxLength: 80,
              },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  {
                    type: string,
                    description: Must exactly equal `DELETE LOAD TEST DATA <testRunId>`.,
                  }
      responses:
        '200':
          description: Tagged test fixtures and source objects removed
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    testRunId,
                    importsDeleted,
                    entitiesDeleted,
                    objectsDeleted,
                    uploadSessionsDeleted,
                    cleaned,
                  ]
                properties:
                  testRunId: { type: string }
                  importsDeleted: { type: integer, minimum: 0 }
                  entitiesDeleted: { type: integer, minimum: 0 }
                  objectsDeleted: { type: integer, minimum: 0 }
                  uploadSessionsDeleted: { type: integer, minimum: 0 }
                  cleaned: { type: boolean, const: true }
        '400':
          {
            description: Invalid test-run identifier,
            confirmation mismatch,
            active run or queue,
            protected activity impact,
            or unsafe object scope,
          }
        '403':
          {
            description: Cleanup disabled,
            production acknowledgement missing,
            missing bearer credentials,
            or caller is not a global administrator,
          }
  /v1/geodata/import-uploads:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Create a restart-safe resumable geodata upload
      description: Creates an owner-bound upload session backed by SeaweedFS S3 multipart storage. Upload in bounded parts, then explicitly complete. Abandoned sessions expire after 24 hours.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: '#/components/schemas/GeoImportUploadSessionCreate' },
              },
          }
      responses:
        '201':
          {
            description: Upload session created,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/GeoImportUploadSession' },
                  },
              },
          }
        '400': { description: Invalid metadata or size }
        '403': { description: geodata.import scope required }
  /v1/geodata/import-uploads/{uploadId}:
    get:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Inspect an owned upload session and its received parts
      parameters:
        [
          {
            in: path,
            name: uploadId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        {
          '200':
            {
              description: Current upload progress,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          $ref: '#/components/schemas/GeoImportUploadSessionProgress',
                        },
                    },
                },
            },
          '404': { description: Session not found for this user },
        }
    delete:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Abort an owned incomplete upload session
      parameters:
        [
          {
            in: path,
            name: uploadId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        { '200': { description: Multipart parts aborted and session closed } }
  /v1/geodata/import-uploads/{uploadId}/parts/{partNumber}:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Upload or retry one bounded binary part
      parameters:
        - {
            in: path,
            name: uploadId,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: path,
            name: partNumber,
            required: true,
            schema: { type: integer, minimum: 1, maximum: 10000 },
          }
        - {
            in: header,
            name: X-Part-SHA256,
            required: false,
            schema: { type: string, pattern: '^[a-fA-F0-9]{64}$' },
          }
      requestBody:
        required: true
        content:
          {
            application/octet-stream:
              { schema: { type: string, format: binary } },
          }
      responses:
        {
          '200': { description: Part stored idempotently },
          '400': { description: Part too large or checksum mismatch },
          '404': { description: Session not found },
        }
  /v1/geodata/import-uploads/{uploadId}/complete:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Verify and complete an upload, then durably enqueue preprocessing
      parameters:
        [
          {
            in: path,
            name: uploadId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { type: object, additionalProperties: false } },
          }
      responses:
        {
          '202':
            {
              description: Object verified and import run created; preprocessing is asynchronous,
            },
        }
  /v1/geodata/location-options:
    get:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: List provider-derived location hierarchy options
      description: Values are aggregated from stored BigDataCloud reverse-geocoding responses; this endpoint does not issue remote lookups.
      responses:
        '200':
          description: Searchable continent, country, subdivision, and province hierarchy
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/LocationOptions' } },
            }
  /v1/activations/entity-deletion-impacts/{entityId}:
    get:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: Read the activity impact of deleting an entity
      operationId: getEntityDeletionImpact
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses: { '200': { description: QSO and award impact } }
  /v1/activations/entity-deletion-cascades:
    post:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: Create the activity cascade for an approved geodata deletion job
      operationId: cascadeEntityDeletion
