# Non-secret rendering example. Replace repositories and tags with published images.
images:
  gateway:
    { repository: ghcr.io/myota-platform/myota-next-gateway, tag: example }
  identity:
    { repository: ghcr.io/myota-platform/myota-next-identity, tag: example }
  identity-maintenance:
    {
      repository: ghcr.io/myota-platform/myota-next-identity-maintenance,
      tag: example,
    }
  programmes:
    { repository: ghcr.io/myota-platform/myota-next-programmes, tag: example }
  activity:
    { repository: ghcr.io/myota-platform/myota-next-activity, tag: example }
  activity-worker:
    {
      repository: ghcr.io/myota-platform/myota-next-activity-worker,
      tag: example,
    }
  activity-notifications:
    {
      repository: ghcr.io/myota-platform/myota-next-activity-notifications,
      tag: example,
    }
  geodata:
    { repository: ghcr.io/myota-platform/myota-next-geodata, tag: example }
  geodata-worker:
    {
      repository: ghcr.io/myota-platform/myota-next-geodata-worker,
      tag: example,
    }
  geodata-importer:
    {
      repository: ghcr.io/myota-platform/myota-next-geodata-importer,
      tag: example,
    }
  email-worker:
    { repository: ghcr.io/myota-platform/myota-next-email-worker, tag: example }
  outbox-worker:
    {
      repository: ghcr.io/myota-platform/myota-next-outbox-worker,
      tag: example,
    }
  admin-web:
    { repository: ghcr.io/myota-platform/myota-next-admin-web, tag: example }
  participant-web:
    {
      repository: ghcr.io/myota-platform/myota-next-participant-web,
      tag: example,
    }
migrations:
  image: { repository: ghcr.io/myota-platform/myota-next-tools, tag: example }
jetstreamProvisioner:
  image: { repository: ghcr.io/myota-platform/myota-next-tools, tag: example }
prometheus:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
  rules:
    enabled: false
    labels:
      release: kube-prometheus-stack
  alertmanagerConfig:
    # Optional test-only receiver. Requires Prometheus Operator CRDs and an
    # SMTP destination.
    enabled: false
    email:
      to: ''
      from: ''
      smarthost: ''
      requireTLS: true
      caSecretName: ''
      caSecretKey: ca.crt
# The API key is supplied by the myota-geodata-enrichment Secret, never here.
geodataWorker:
  locationEnrichment:
    reverseGeocodeUrl: https://api-bdc.net/data/reverse-geocode
    localityLanguage: en
    timeoutSeconds: '10'
# Configure and explicitly enable components.geodata-importer before deployment.
geodataImporter:
  pollSeconds: 60
  sourceMaxBytes: 33554432
  sourceAllowlist:
    - data.example.org
ingress:
  enabled: true
  entryPoints: [websecure]
  apiHost: api.example.org
  adminHost: admin.example.org
  participantHost: www.example.org
  objectStorageHost: s3.example.org
  objectStorageService: myota-s3
  objectStoragePort: 8333
  tls:
    certResolver: acmeresolver
    secretName: ''
  compression:
    enabled: true
    minResponseBodyBytes: 128
    encodings: [br, gzip]
    includedContentTypes: [application/json]
