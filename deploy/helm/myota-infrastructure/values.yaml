imagePullPolicy: IfNotPresent
postgresSecret: myota-postgres-auth
storageClassName: ''
resources: {}
objectStorage:
  enabled: false
  image: chrislusf/seaweedfs:latest@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
  configSecretName: myota-seaweedfs-s3-config
  credentialsSecretName: myota-object-storage
  storage: 20Gi
  storageClassName: ''
  buckets:
    - myota-user-profile-images
    - myota-adif
    - myota-award-assets
    - myota-award-signatures
    - myota-certificates
    - myota-geodata-imports
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: '2', memory: 2Gi }

# Keep exactly these three databases. Email delivery is owned by Core.
databases:
  core:
    name: myota_core
    image: postgres:16-alpine
    storage: 10Gi
  activity:
    name: myota_activity
    image: postgres:16-alpine
    storage: 20Gi
  geo:
    name: myota_geo
    image: postgis/postgis:16-3.4
    storage: 50Gi
