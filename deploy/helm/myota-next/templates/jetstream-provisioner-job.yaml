{{- if .Values.jetstreamProvisioner.enabled }}
{{- if not .Values.jetstreamProvisioner.confirmedCapacityReview }}
{{- fail "jetstreamProvisioner.enabled requires jetstreamProvisioner.confirmedCapacityReview=true after the documented topology and capacity review" }}
{{- end }}
{{- $capacity := .Values.jetstreamProvisioner.capacity }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "myota-next.name" . }}-jetstream-provisioner-{{ .Release.Revision }}
  labels:
    {{- include "myota-next.labels" . | nindent 4 }}
    app.kubernetes.io/component: jetstream-provisioner
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    myota.org/job-purpose: create-only-jetstream-topology
spec:
  backoffLimit: {{ .Values.jetstreamProvisioner.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.jetstreamProvisioner.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: jetstream-provisioner
    spec:
      restartPolicy: Never
      containers:
        - name: provisioner
          image: {{ include "myota-next.image" (dict "image" .Values.jetstreamProvisioner.image "name" "jetstreamProvisioner") | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/nodejs/bin/node", "--experimental-strip-types", "tools/provision-jetstream.ts"]
          env:
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.nats }}
                  key: url
            - name: NATS_TOPOLOGY_APPLY
              value: "1"
            - name: NATS_TOPOLOGY_SCOPE
              value: all
{{- $capacityEnv := dict
  "NATS_EVENTS_MAX_BYTES" $capacity.eventsMaxBytes
  "NATS_EVENTS_MAX_MESSAGES" $capacity.eventsMaxMessages
  "NATS_EVENTS_MAX_MESSAGE_BYTES" $capacity.eventsMaxMessageBytes
  "NATS_ACTIVITY_WORK_MAX_AGE_SECONDS" $capacity.activityWorkMaxAgeSeconds
  "NATS_ACTIVITY_WORK_MAX_BYTES" $capacity.activityWorkMaxBytes
  "NATS_ACTIVITY_WORK_MAX_MESSAGES" $capacity.activityWorkMaxMessages
  "NATS_ACTIVITY_WORK_MAX_MESSAGE_BYTES" $capacity.activityWorkMaxMessageBytes
  "NATS_GEODATA_WORK_MAX_AGE_SECONDS" $capacity.geodataWorkMaxAgeSeconds
  "NATS_GEODATA_WORK_MAX_BYTES" $capacity.geodataWorkMaxBytes
  "NATS_GEODATA_WORK_MAX_MESSAGES" $capacity.geodataWorkMaxMessages
  "NATS_GEODATA_WORK_MAX_MESSAGE_BYTES" $capacity.geodataWorkMaxMessageBytes
  "NATS_EMAIL_WORK_MAX_AGE_SECONDS" $capacity.emailWorkMaxAgeSeconds
  "NATS_EMAIL_WORK_MAX_BYTES" $capacity.emailWorkMaxBytes
  "NATS_EMAIL_WORK_MAX_MESSAGES" $capacity.emailWorkMaxMessages
  "NATS_EMAIL_WORK_MAX_MESSAGE_BYTES" $capacity.emailWorkMaxMessageBytes
}}
{{- range $name, $value := $capacityEnv }}
            - name: {{ $name }}
              value: {{ required (printf "jetstreamProvisioner.capacity value for %s is required" $name) $value | quote }}
{{- end }}
{{- include "myota-next.geodata-worker-policy-env" . | nindent 12 }}
{{- end }}
