{{- if .Values.prometheus.alertmanagerConfig.enabled }}
{{- $email := .Values.prometheus.alertmanagerConfig.email }}
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ include "myota-next.name" . }}-test-alerts
  labels:
    {{- include "myota-next.labels" . | nindent 4 }}
spec:
  route:
    receiver: myota-test-email
    groupBy: [alertname, namespace, service]
    groupWait: 0s
    groupInterval: 1m
    repeatInterval: 24h
    matchers:
      - name: alertname
        matchType: "="
        value: MyOTAUnresolvedOutboxDeadLetters
  receivers:
    - name: myota-test-email
      emailConfigs:
        - to: {{ required "prometheus.alertmanagerConfig.email.to is required when enabled" $email.to | quote }}
          from: {{ required "prometheus.alertmanagerConfig.email.from is required when enabled" $email.from | quote }}
          smarthost: {{ required "prometheus.alertmanagerConfig.email.smarthost is required when enabled" $email.smarthost | quote }}
          requireTLS: {{ $email.requireTLS }}
          sendResolved: true
          {{- if $email.caSecretName }}
          tlsConfig:
            ca:
              secret:
                name: {{ $email.caSecretName | quote }}
                key: {{ $email.caSecretKey | quote }}
          {{- end }}
{{- end }}
