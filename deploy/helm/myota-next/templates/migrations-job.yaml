{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "myota-next.name" . }}-migrations-{{ .Release.Revision }}
  labels:
    {{- include "myota-next.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: {{ include "myota-next.image" (dict "image" .Values.migrations.image "name" "migrations") | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["sh", "-ec"]
          args:
            - >-
              node --experimental-strip-types tools/db-migrate.ts --owner=core &&
              node --experimental-strip-types tools/db-migrate.ts --owner=activity &&
              node --experimental-strip-types tools/db-migrate.ts --owner=geo
          env:
            - name: CORE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.databaseMigrations }}
                  key: core-database-url
            - name: ACTIVITY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.databaseMigrations }}
                  key: activity-database-url
            - name: GEO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.databaseMigrations }}
                  key: geo-database-url
{{- end }}
