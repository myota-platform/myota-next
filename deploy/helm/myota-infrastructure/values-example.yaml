# Non-secret single-node example; size volumes for real data before deployment.
imagePullPolicy: IfNotPresent
postgresSecret: myota-postgres-auth
storageClassName: ''
# Bounded single-instance PostgreSQL profile; increase only after measurement.
resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: '1', memory: 2Gi }
databases:
  core:
    name: myota_core
    image: 'ghcr.io/myota-platform/myota-next-postgres:<release-tag>'
    storage: 10Gi
  activity:
    name: myota_activity
    image: 'ghcr.io/myota-platform/myota-next-postgres:<release-tag>'
    storage: 20Gi
  geo:
    name: myota_geo
    image: 'ghcr.io/myota-platform/myota-next-postgis:<release-tag>'
    storage: 50Gi
