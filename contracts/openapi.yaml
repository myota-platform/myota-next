components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IfMatch:
      in: header
      name: If-Match
      required: false
      description: Quoted entity version from a previous GET or catalogue response. A stale version returns HTTP 409; reload and reconcile rather than retrying blindly.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 128 }
    AccountId:
      in: path
      name: accountId
      required: true
      schema: { type: string, format: uuid }
    EntityId:
      in: path
      name: entityId
      required: true
      schema: { type: string, format: uuid }
    ActivationId:
      in: path
      name: activationId
      required: true
      schema: { type: string, format: uuid }
    CallsignId:
      in: path
      name: callsignId
      required: true
      schema: { type: string, format: uuid }
    AwardId:
      in: path
      name: awardId
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      in: path
      name: requestId
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      in: path
      name: assetId
      required: true
      schema: { type: string, format: uuid }
    IssuanceId:
      in: path
      name: issuanceId
      required: true
      schema: { type: string, format: uuid }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, detail, requestId, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code:
          {
            type: string,
            enum:
              [invalid_request, not_found, forbidden, conflict, internal_error],
          }
        detail: { type: string }
        requestId:
          { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }
        correlationId:
          { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }
    ServiceTokenRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [service, clientSecret]
          properties:
            service: { const: email-service }
            clientSecret: { type: string, minLength: 32, writeOnly: true }
          description: Email service client-credentials flow; scope is fixed by Identity.
        - type: object
          additionalProperties: false
          required: [service, scopes]
          properties:
            service:
              {
                type: string,
                minLength: 1,
                maxLength: 80,
                not: { const: email-service },
              }
            scopes: { type: array, items: { type: string }, uniqueItems: true }
          description: Administrative service-token issuance; requires identity.service.issue.
    EmailRecipientAddress:
      type: object
      additionalProperties: false
      required: [deliverableAddress]
      properties:
        deliverableAddress: { type: string, format: email, maxLength: 254 }
        templateData:
          type: object
          additionalProperties: false
          oneOf:
            - required: [resetUrl]
              properties:
                resetUrl:
                  { type: string, format: uri, minLength: 1, maxLength: 2048 }
            - required: [confirmationUrl]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 120 }
                confirmationUrl:
                  { type: string, format: uri, minLength: 1, maxLength: 2048 }
            - required: [displayName]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 120 }
              description: Completion notification without a bearer link.
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newEmail]
      properties:
        currentPassword:
          { type: string, minLength: 1, maxLength: 128, writeOnly: true }
        newEmail: { type: string, format: email, maxLength: 254 }
    EmailChangeVerify:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 40, maxLength: 60, writeOnly: true }
    EmailChangeStatus:
      type: object
      additionalProperties: false
      required: [pending]
      properties:
        pending:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required:
                [
                  id,
                  currentEmail,
                  newEmail,
                  oldAddressVerified,
                  newAddressVerified,
                  expiresAt,
                ]
              properties:
                id: { type: string, format: uuid }
