imagePullPolicy: IfNotPresent
postgresSecret: myota-postgres-auth
storageClassName: ''
resources: {}
objectStorage:
  enabled: false
  image: chrislusf/seaweedfs:latest@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
  provisionerImage: ''
  configSecretName: myota-seaweedfs-s3-config
  credentialsSecretName: myota-object-storage
  storage: 20Gi
  storageClassName: ''
  buckets:
    - myota-user-profile-images
    - myota-adif
    - myota-award-assets
    - myota-award-signatures
    - myota-certificates
    - myota-geodata-imports
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: '2', memory: 2Gi }

# Keep exactly these three databases. Email delivery is owned by Core.
databases:
  core:
    name: myota_core
    image: postgres:16-alpine3.24@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    storage: 10Gi
  activity:
    name: myota_activity
    image: postgres:16-alpine3.24@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    storage: 20Gi
  geo:
    name: myota_geo
    image: postgis/postgis:16-3.6-alpine@sha256:a8ae5aac22bfe4b734c1fa0644ca18039a1e6bd7105c5aa9308cd24bfa1b2ef7
    storage: 50Gi
