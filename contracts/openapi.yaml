      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityId, deletedBy]
              properties:
                entityId: { type: string, format: uuid }
                deletedBy: { type: string }
      responses:
        { '200': { description: QSO cascade and award recalculation result } }
  /v1/activations:
    get:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: List activations for authorised operators and administrators
      parameters:
        - in: query
          name: programme
          schema: { type: string }
        - in: query
          name: operatorId
          description: Required for participants, who may list only their own activations.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses: { '200': { description: Activation page } }
    post:
      tags: [Activity]
      summary: Start an activation
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/Activation' } },
          }
      responses: { '201': { description: Created } }
  /v1/activations/{activationId}:
    get:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: Get an authorized activation and its normalized QSOs and import outcomes
      parameters: [{ $ref: '#/components/parameters/ActivationId' }]
      responses:
        '200':
          description: Activation details for its owner or an authorized Activity administrator
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ActivationDetail' } }
        '403': { description: Caller lacks Participant or Activity read scope }
        '404': { description: Activation is missing or not owned by the caller }
    patch:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: Update an activation lifecycle state
      operationId: patchActivation
      parameters:
        [
          { $ref: '#/components/parameters/ActivationId' },
          { $ref: '#/components/parameters/IdempotencyKey' },
        ]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ActivationClose' } },
          }
      responses:
        {
          '200':
            {
              description: Activation closed with the stored rule evaluation snapshot,
            },
        }
  /v1/activations/{activationId}/qsos:
    post:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: Record a normalized QSO for an open activation
      parameters: [{ $ref: '#/components/parameters/ActivationId' }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/Qso' } } }
      responses: { '201': { description: QSO recorded } }
  /v1/awards:
    get:
