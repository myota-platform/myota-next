name: Publish NestJS images

on:
  pull_request:
    branches: [main, testing]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm ci --prefix web/admin
      - run: npm run lint --prefix web/admin
      - run: npm run typecheck --prefix web/admin
      - run: npm run build --prefix web/admin

  verify-images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app:
          - gateway
          - identity
          - identity-maintenance
          - programmes
          - activity
          - activity-worker
          - activity-notifications
          - geodata
          - geodata-worker
          - geodata-importer
          - email-worker
          - outbox-worker
          - tools
          - admin-web
          - participant-web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set application build argument
        id: app-build-arg
        if: matrix.app != 'tools' && matrix.app != 'admin-web' && matrix.app != 'participant-web'
        env:
          APP_NAME: ${{ matrix.app }}
        run: printf 'value=APP_NAME=%s\n' "$APP_NAME" >> "$GITHUB_OUTPUT"
      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app == 'admin-web' && './web/admin' || matrix.app == 'participant-web' && './web/participant' || '.' }}
          file: ${{ matrix.app == 'tools' && 'deploy/Dockerfile.tools' || matrix.app == 'admin-web' && 'web/admin/Dockerfile' || matrix.app == 'participant-web' && 'web/participant/Dockerfile' || 'Dockerfile' }}
          build-args: ${{ steps.app-build-arg.outputs.value }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app:
          - gateway
          - identity
          - identity-maintenance
          - programmes
          - activity
          - activity-worker
          - activity-notifications
          - geodata
          - geodata-worker
          - geodata-importer
          - email-worker
          - outbox-worker
          - tools
          - admin-web
          - participant-web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
      - name: Set application build argument
        id: app-build-arg
        if: matrix.app != 'tools' && matrix.app != 'admin-web' && matrix.app != 'participant-web'
        env:
          APP_NAME: ${{ matrix.app }}
        run: printf 'value=APP_NAME=%s\n' "$APP_NAME" >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app == 'admin-web' && './web/admin' || matrix.app == 'participant-web' && './web/participant' || '.' }}
          file: ${{ matrix.app == 'tools' && 'deploy/Dockerfile.tools' || matrix.app == 'admin-web' && 'web/admin/Dockerfile' || matrix.app == 'participant-web' && 'web/participant/Dockerfile' || 'Dockerfile' }}
          build-args: ${{ steps.app-build-arg.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: mode=max
          sbom: true
      - name: Record image digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
