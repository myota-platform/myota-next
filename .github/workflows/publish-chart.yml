name: Publish Helm chart

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag whose source should be packaged
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-helm-chart-${{ github.repository }}
  cancel-in-progress: false

jobs:
  package:
    name: Package and publish Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # Required to push the versioned chart repository commit.
      pages: write # Required to publish the chart repository site.
      id-token: write # Required by GitHub Pages deployment.
      actions: read # Required by the Pages deployment action.
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$EVENT_TAG"
          if [ -z "$tag" ]; then tag="$INPUT_TAG"; fi
          test -n "$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Validate Helm charts
        run: |
          helm lint deploy/helm/myota-next -f deploy/helm/myota-next/values-testing.yaml
          helm lint deploy/helm/myota-infrastructure \
            --values deploy/helm/myota-infrastructure/values-example.yaml \
            --set objectStorage.enabled=true \
            --set objectStorage.provisionerImage=ghcr.io/myota-platform/myota-next-tools:ci

      - name: Prepare versioned chart repository
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          auth_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir chart-repository
          git -C chart-repository init --initial-branch=gh-pages
          git -C chart-repository remote add origin "$auth_url"
          git -C chart-repository config user.name github-actions[bot]
          git -C chart-repository config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git -C chart-repository fetch --depth=1 origin gh-pages
            git -C chart-repository reset --hard FETCH_HEAD
          else
            touch chart-repository/.nojekyll
            git -C chart-repository add .nojekyll
            git -C chart-repository commit -m 'Initialize Helm repository'
            git -C chart-repository push origin HEAD:gh-pages
          fi

          chart_version="${RELEASE_TAG#v}"
          if [[ ! "$chart_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH (for example v1.1.0): $RELEASE_TAG" >&2
            exit 1
          fi
          helm package deploy/helm/myota-next \
            --version "$chart_version" \
            --app-version "$RELEASE_TAG" \
            --destination chart-repository
          if [ -f chart-repository/index.yaml ]; then
            helm repo index chart-repository \
              --url "https://myota-platform.github.io/myota-next" \
              --merge chart-repository/index.yaml
          else
            helm repo index chart-repository \
              --url "https://myota-platform.github.io/myota-next"
          fi
          cat > chart-repository/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><meta charset="utf-8"><title>MyOTA Helm repository</title>
          <h1>MyOTA Helm repository</h1>
          <p>Rancher catalog and Helm repository: <a href="index.yaml">index.yaml</a>.</p>
          <p>Install with <code>helm repo add myota https://myota-platform.github.io/myota-next</code>.</p>
          </html>
          HTML
          touch chart-repository/.nojekyll
          git -C chart-repository config user.name github-actions[bot]
          git -C chart-repository config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C chart-repository add .
          git -C chart-repository commit -m "Publish myota-next chart ${chart_version} for ${RELEASE_TAG}"
          git -C chart-repository push origin HEAD:gh-pages
          rm -rf chart-repository/.git
          echo "Published chart version ${chart_version} for application release ${RELEASE_TAG}." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: chart-repository

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
