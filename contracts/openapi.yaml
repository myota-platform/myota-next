            type: string,
            enum:
              [
                UPLOAD_PENDING,
                QUEUED,
                PROCESSING,
                CANCELLING,
                CANCELLED,
                PREPROCESSED,
                PREPROCESSED_WITH_ERRORS,
                COMPLETED,
                COMPLETED_WITH_ERRORS,
                FAILED,
                PROCESSED,
              ],
          }
        queuedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        featureCount: { type: integer, nullable: true }
        stats: { type: object, additionalProperties: { type: integer } }
        manifest: { type: object, nullable: true, additionalProperties: true }
        errors:
          { type: array, items: { type: object, additionalProperties: true } }
        candidateCounts:
          { type: object, additionalProperties: { type: integer } }
        processedAt: { type: string, format: date-time, nullable: true }
        processedBy: { type: string, nullable: true }
        cancellationRequestedAt:
          { type: string, format: date-time, nullable: true }
        cancellationRequestedBy: { type: string, nullable: true }
    GeoImportCandidate:
      type: object
      required: [id, importRunId, ordinal, name, geometry, validationStatus]
      properties:
        id: { type: string, format: uuid }
        importRunId: { type: string, format: uuid }
        programmeSlug: { type: string, nullable: true }
        ordinal: { type: integer, minimum: 0 }
        existingEntityId: { type: string, format: uuid, nullable: true }
        entityIdentifier: { type: string, nullable: true }
        name: { type: string }
        entityTypes: { type: array, items: { type: string } }
        geometry: { type: object, additionalProperties: true }
        centroid: { type: object, additionalProperties: true }
        sourceRef: { type: string, nullable: true }
        candidateSource: { type: object, additionalProperties: true }
        dedupeWarning:
          {
            type: string,
            enum: [POSSIBLE_DUPLICATE],
            nullable: true,
            description: Present when an existing entity has identical geometry or is within 50 metres.,
          }
        possibleDuplicates:
          {
            type: array,
            items: { $ref: '#/components/schemas/GeoImportDuplicate' },
          }
        validationStatus:
          { type: string, enum: [PENDING, CONFIRMED, REJECTED, PROCESSED] }
        validationNote: { type: string, nullable: true }
        validatedBy: { type: string, nullable: true }
        validatedAt: { type: string, format: date-time, nullable: true }
        targetStatus:
          { type: string, enum: [CANDIDATE, APPROVED], nullable: true }
        processedEntityId: { type: string, format: uuid, nullable: true }
        processedAt: { type: string, format: date-time, nullable: true }
    GeoEntityIdSuggestion:
      type: object
      required: [entityIdentifier, assigned, reserved]
      properties:
        entityIdentifier: { type: string }
        serial: { type: integer, minimum: 1 }
        paddedSerial: { type: string, pattern: '^\\d{3,6}$' }
        qualifier: { type: string, nullable: true }
        assigned: { type: boolean }
        reserved: { type: boolean }
        location: { type: object, additionalProperties: true }
    GeoImportDuplicate:
      type: object
      required: [entityId, name, geometry, distanceMeters, matchType]
      properties:
        entityId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, nullable: true }
        entityTypes: { type: array, items: { type: string } }
        geometry: { type: object, additionalProperties: true }
        centroid: { type: object, additionalProperties: true }
        distanceMeters:
          { type: number, format: double, minimum: 0, maximum: 50 }
        matchType:
          { type: string, enum: [IDENTICAL_GEOMETRY, WITHIN_50_METERS] }
    GeoImportCandidatePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          {
            type: array,
            items: { $ref: '#/components/schemas/GeoImportCandidate' },
          }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        nextPage: { type: integer, nullable: true }
    GeoImportCandidateValidation:
      type: object
      required: [candidateIds, reviewerId]
      properties:
        candidateIds:
          {
            type: array,
            minItems: 1,
            maxItems: 300,
            items: { type: string, format: uuid },
          }
        reviewerId: { type: string }
        validationStatus:
          {
            type: string,
            enum: [VALID, REJECTED],
            default: VALID,
            description: VALID confirms records for later promotion; REJECTED removes them from the import staging queue.,
          }
        note: { type: string }
    GeoImportProcessingRequest:
      type: object
      required: [candidateIds, targetStatus, processorId]
      properties:
        candidateIds:
          {
            type: array,
            minItems: 1,
            maxItems: 300,
            items: { type: string, format: uuid },
          }
        targetStatus: { type: string, enum: [CANDIDATE, APPROVED] }
        processorId: { type: string }
        note: { type: string }
    GeoImportFinalization:
      type: object
      required: [processedBy]
      properties:
        processedBy:
          {
            type: string,
            description: Account or administrator identifier that finalized the run.,
          }
        actor:
          { type: string, description: Compatibility alias for processedBy. }
    GeoImportProcessingQueue:
      type: object
      required: [id, importRunId, candidateIds, targetStatus, status]
      properties:
        id: { type: string, format: uuid }
        importRunId: { type: string, format: uuid }
        candidateIds: { type: array, items: { type: string, format: uuid } }
        targetStatus: { type: string, enum: [CANDIDATE, APPROVED] }
        requestedBy: { type: string }
        status: { type: string, enum: [QUEUED, PROCESSING, COMPLETED, FAILED] }
        requestedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        attemptCount: { type: integer, minimum: 0 }
        error: { type: string, nullable: true }
        redriveHistory:
          type: array
          items:
            type: object
            required: [requestedAt, requestedBy, reason]
            properties:
              requestedAt: { type: string, format: date-time }
              requestedBy: { type: string }
              reason: { type: string }
              previousAttemptCount: { type: integer }
              previousError: { type: string, nullable: true }
              previousResult:
                { type: object, nullable: true, additionalProperties: true }
        result:
          type: object
          properties:
            created: { type: array, items: { type: string, format: uuid } }
            updated: { type: array, items: { type: string, format: uuid } }
            errors:
              type: array
              items:
                type: object
                required: [candidateId, message]
                properties:
                  candidateId: { type: string, format: uuid }
                  message: { type: string }
          additionalProperties: true
    GeoImportProcessingResult:
      type: object
      required:
        [
          importRunId,
          candidateIds,
          targetStatus,
          requestedBy,
          status,
          created,
          updated,
          completedAt,
        ]
      properties:
        importRunId: { type: string, format: uuid }
        candidateIds:
          {
            type: array,
            minItems: 1,
            maxItems: 300,
            items: { type: string, format: uuid },
          }
        targetStatus: { type: string, enum: [CANDIDATE, APPROVED] }
        requestedBy: { type: string }
        status: { type: string, enum: [COMPLETED] }
        created: { type: array, items: { type: string, format: uuid } }
        updated: { type: array, items: { type: string, format: uuid } }
        completedAt: { type: string, format: date-time }
    GeoImportProcessingRedrive:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    GeoEntity:
      type: object
      required: [id, name, status, geometry]
      properties:
        id: { type: string, format: uuid }
        version:
          {
            type: integer,
            minimum: 1,
            readOnly: true,
            description: Database revision for optimistic concurrency; also returned as ETag on entity responses.,
          }
        programmeSlug:
          {
            type: string,
            nullable: true,
            description: Optional programme eligibility assignment.,
          }
        entityIdentifier:
          {
            type: string,
            nullable: true,
            description: Stable programme-scoped identifier assigned and retained by Geodata.,
          }
        entityType: { type: string }
        entityTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        entityTypeCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        name: { type: string }
        website:
          {
            type: [string, 'null'],
            maxLength: 2048,
            format: uri,
            pattern: '^https?://',
            description: Optional absolute HTTP or HTTPS URL.,
          }
        description:
          {
            type: [string, 'null'],
            maxLength: 2000,
            description: Optional plain-text description.,
          }
        status: { type: string, enum: [CANDIDATE, APPROVED, REJECTED, RETIRED] }
        candidateSource:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [ADAPTER_IMPORT, COMMUNITY_PROPOSAL] }
            adapter: { type: string, nullable: true }
            importRunId: { type: string, format: uuid, nullable: true }
            proposalId: { type: string, format: uuid, nullable: true }
            proposerId: { type: string, nullable: true }
            sourceKey: { type: string, nullable: true }
            sourceRef: { type: string, nullable: true }
        geometry:
          {
            type: object,
            additionalProperties: true,
            description: GeoJSON geometry. Ways use type LineString; the import API also accepts the non-standard geometry type alias way and normalizes it to LineString.,
          }
        centroid: { type: object, additionalProperties: true }
        maidenheadGridSquares4:
          type: array
          readOnly: true
          uniqueItems: true
          items: { type: string, pattern: '^[A-R]{2}[0-9]{2}$' }
          description: Sorted grid squares at four-character Maidenhead precision intersected by the entity geometry.
        maidenheadLocators6:
          type: array
          readOnly: true
          uniqueItems: true
          items: { type: string, pattern: '^[A-R]{2}[0-9]{2}[a-x]{2}$' }
          description: Sorted locators at six-character Maidenhead precision intersected by the entity geometry.
        continent: { type: string, nullable: true }
        continentCode:
          {
            type: string,
            nullable: true,
            description: ISO-style continent code from the geocoder,
          }
        country: { type: string, nullable: true }
        countryCode:
          { type: string, nullable: true, description: ISO 3166-1 country code }
        region:
          {
            type: string,
            nullable: true,
            description: First administrative subdivision after the country,
          }
        regionCode:
          {
            type: string,
            nullable: true,
            description: ISO 3166-2 code for the first subdivision after the country,
          }
        subdivision: { type: string, nullable: true }
        subdivisionCode: { type: string, nullable: true }
        province: { type: string, nullable: true }
        provinceCode: { type: string, nullable: true }
        county: { type: string, nullable: true }
        countyCode: { type: string, nullable: true }
        city:
          { type: string, nullable: true, description: City or municipality }
        municipality: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        manualLocationFields:
          {
            type: array,
            items: { type: string },
            description: Fields explicitly maintained by an administrator,
          }
        geocodeProvider: { type: string, nullable: true }
        geocodeStatus:
          {
            type: string,
            enum:
              [
                ENRICHED,
                SOURCE_DATA,
                FAILED,
                NOT_CONFIGURED,
                SKIPPED_NO_CENTROID,
              ],
            nullable: true,
          }
        geocodedAt: { type: string, format: date-time, nullable: true }
        locationEnrichmentStatus:
          {
            type: string,
            enum: [QUEUED, COMPLETED, FAILED],
            nullable: true,
            readOnly: true,
          }
        locationEnrichmentRequestedAt:
          { type: string, format: date-time, nullable: true, readOnly: true }
        locationEnrichmentCompletedAt:
          { type: string, format: date-time, nullable: true, readOnly: true }
        provenance: { type: object, additionalProperties: true }
    GeodataTileCollection:
      type: object
      required:
        [
          type,
          bbox,
          features,
          count,
          truncated,
          cacheTtlSeconds,
          cacheKey,
          performanceBudgetMs,
          tile,
          format,
        ]
      properties:
        type: { const: FeatureCollection }
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number }
          description: 'minLon, minLat, maxLon, maxLat'
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type: { const: Feature }
              id: { type: string }
              geometry: { type: object, additionalProperties: true }
              properties:
                type: object
                additionalProperties: true
        count: { type: integer, minimum: 0, maximum: 500 }
        truncated: { type: boolean }
        cacheTtlSeconds: { type: integer, const: 60 }
        cacheKey: { type: string, pattern: '^[a-f0-9]{64}$' }
        performanceBudgetMs: { type: integer, const: 250 }
        tile:
          type: object
          required: [z, x, y]
          properties:
            z: { type: integer, minimum: 0, maximum: 22 }
            x: { type: integer, minimum: 0 }
            y: { type: integer, minimum: 0 }
        format: { const: geojson-vector }
    GeodataEntityMetadataPatch:
      type: object
      required: [editorId]
      minProperties: 2
      description: Omitted fields are unchanged. Website and description accept null or empty string to clear their stored value. Location fields are edited under geodata.location.manage; manualFields identifies the values protected from provider refreshes, while catalogue codes remain provider-derived.
      properties:
        editorId: { type: string }
        name: { type: string, minLength: 1, maxLength: 240 }
        website:
          {
            type: [string, 'null'],
            maxLength: 2048,
            format: uri,
            pattern: '^https?://',
            description: Send null or an empty string to clear. Omission preserves the stored value.,
          }
        description:
          {
            type: [string, 'null'],
            maxLength: 2000,
            description: Plain text only; send null or an empty string to clear. Omission preserves the stored value.,
          }
        location: { $ref: '#/components/schemas/LocationMetadata' }
        manualFields:
          {
            type: array,
            uniqueItems: true,
            items:
              {
                type: string,
                enum:
                  [
                    continent,
                    country,
                    region,
                    subdivision,
                    province,
                    county,
                    city,
                    municipality,
                    locality,
                  ],
              },
          }
        note: { type: string }
    LocationEnrichmentRequest:
      type: object
      required: [editorId]
      additionalProperties: false
      properties:
        editorId: { type: string }
    LocationEnrichmentReceipt:
      type: object
      required: [entityId, requestId, status, missingFields, queued]
      properties:
        entityId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED] }
        missingFields: { type: array, items: { type: string } }
        queued: { type: boolean, const: true }
    GeodataEntityCategoriesPut:
      type: object
      required: [entityTypes, editorId]
      properties:
        entityTypes:
          {
            type: array,
            minItems: 1,
            uniqueItems: true,
            items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' },
          }
        editorId: { type: string }
        note: { type: string }
    GeodataEntityReview:
      type: object
      required: [status, reviewerId]
      properties:
        status: { type: string, enum: [CANDIDATE, APPROVED, RETIRED, REJECTED] }
        decision: { type: string, deprecated: true }
        reviewerId: { type: string }
        note: { type: string }
    GeodataEntityDeletionJobRequest:
      type: object
      required: [entityId, requestedBy]
      properties:
        entityId: { type: string, format: uuid }
        requestedBy: { type: string }
    GeodataEntityDeletionConfirmation:
      type: object
      required: [confirmation, deletedBy]
      properties:
        confirmation: { type: string, enum: [DELETE] }
        deletedBy: { type: string }
    LocationMetadata:
      type: object
      additionalProperties: false
      properties:
        continent: { type: string, nullable: true }
        continentCode: { type: string, nullable: true }
        country: { type: string, nullable: true }
        countryCode: { type: string, nullable: true }
        region: { type: string, nullable: true }
        regionCode: { type: string, nullable: true }
        subdivision: { type: string, nullable: true }
        subdivisionCode: { type: string, nullable: true }
        province: { type: string, nullable: true }
        provinceCode: { type: string, nullable: true }
        county: { type: string, nullable: true }
        countyCode: { type: string, nullable: true }
        city: { type: string, nullable: true }
        municipality: { type: string, nullable: true }
        locality: { type: string, nullable: true }
    LocationOptions:
      type: object
      required: [provider, continents]
      properties:
        provider: { type: string, example: BIGDATACLOUD }
        codeStandards: { type: object, additionalProperties: { type: string } }
        continents:
          type: array
          items:
            type: object
            required: [name, countries]
            properties:
              name: { type: string }
              code: { type: string, nullable: true }
              countries:
                type: array
                items:
                  type: object
                  required: [name, subdivisions]
                  properties:
                    name: { type: string }
                    code: { type: string, nullable: true }
                    subdivisions:
                      type: array
                      items:
                        type: object
                        required: [name, provinces]
                        properties:
                          name: { type: string }
                          code: { type: string, nullable: true }
                          provinces:
                            type: array
                            items:
                              type: object
                              required: [name]
                              properties:
                                name: { type: string }
                                code: { type: string, nullable: true }
    LocationMetadataEdit:
      type: object
      required: [location, editorId]
      properties:
        location:
          allOf:
            - $ref: '#/components/schemas/LocationMetadata'
          description: Stable GeoEntity location fields; null clears a manual value.
        manualFields:
          type: array
          items:
            {
              type: string,
              enum:
                [
                  continent,
                  country,
                  region,
                  subdivision,
                  province,
                  county,
                  city,
                  municipality,
                  locality,
                ],
            }
          description: Fields that remain authoritative over reverse-geocoding refreshes.
        editorId: { type: string }
        note: { type: string }
    Activation:
      type: object
      required: [programmeSlug, entityId, operatorId, startedAt]
      properties:
        programmeSlug: { type: string }
        entityId: { type: string, format: uuid }
        operatorId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        entityType: { type: string }
        location: { type: object, additionalProperties: true }
    ActivationClose:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [CLOSED] }
        endedAt: { type: string, format: date-time }
    Qso:
      type: object
      required: [workedCallsign, timestamp]
      properties:
        id: { type: string, format: uuid }
        activationId: { type: string, format: uuid }
        workedCallsign: { type: string }
        timestamp: { type: string, format: date-time }
        band: { type: string }
        mode: { type: string }
        rst: { type: string }
        hunterId: { type: string, format: uuid }
        workedEntityId: { type: string, format: uuid }
        source: { type: string }
        sourceImportId: { type: [string, 'null'], format: uuid }
        status: { type: string }
    ActivationDetail:
      allOf:
        - { $ref: '#/components/schemas/Activation' }
        - type: object
          properties:
            id: { type: string, format: uuid }
            operatorCallsign: { type: [string, 'null'] }
            status: { type: string }
            endedAt: { type: [string, 'null'], format: date-time }
            qsoCount: { type: integer }
            qsos:
              type: array
              items: { $ref: '#/components/schemas/Qso' }
            imports:
              type: array
              items: { $ref: '#/components/schemas/AdifImportSummary' }
    AdifImportSummary:
      type: object
      required:
        [id, filename, status, recordsSeen, recordsAccepted, recordsRejected]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        status: { type: string }
        recordsSeen: { type: integer }
        recordsAccepted: { type: integer }
        recordsRejected: { type: integer }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    QsoIngestionRequest:
      type: object
      required: [activationId, qsos]
      properties:
        activationId: { type: string, format: uuid }
        sourceFormat: { type: string, enum: [JSON, CSV, ADIF] }
        qsos:
          {
            type: array,
            minItems: 1,
            items: { $ref: '#/components/schemas/Qso' },
          }
    ActivityWorkRedriveRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    CsvQsoIngestionRequest:
      type: object
      required: [activationId, filename, contentBase64]
      properties:
        activationId: { type: string, format: uuid }
        filename:
          { type: string, minLength: 5, maxLength: 255, pattern: '\.csv$' }
        contentBase64:
          {
            type: string,
            contentEncoding: base64,
            description: UTF-8 CSV with workedCallsign and timestamp columns; optional band,
            mode,
            rst,
            hunterCallsign,
            hunterId,
            workedEntityId,
            and workedLocator columns,
          }
    AdifImportRequest:
      type: object
      required: [activationId, filename, contentBase64]
      properties:
        activationId: { type: string, format: uuid }
        filename: { type: string, minLength: 1, maxLength: 255 }
        contentBase64: { type: string, contentEncoding: base64 }
    QsoCorrectionReview:
      type: object
      required: [decision, reviewedBy]
      properties:
        decision: { type: string, enum: [APPLIED, REJECTED] }
        reviewedBy: { type: string }
        reviewNote: { type: string }
    QsoCorrectionPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          {
            type: array,
            items: { $ref: '#/components/schemas/QsoCorrectionWithContext' },
          }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        nextPage: { type: integer, nullable: true }
    QsoCorrectionWithContext:
      allOf:
        - $ref: '#/components/schemas/QsoCorrection'
        - type: object
          required: [programmeSlug, entityId, qso]
          properties:
            programmeSlug: { type: string }
            entityId: { type: string, nullable: true }
            qso:
              type: object
              required: [id, activationId]
              properties:
                id: { type: string, format: uuid }
                activationId: { type: string, format: uuid }
                operatorId: { type: string, nullable: true }
                operatorCallsign: { type: string, nullable: true }
                workedCallsign: { type: string, nullable: true }
                timestamp: { type: string, format: date-time, nullable: true }
                band: { type: string, nullable: true }
                mode: { type: string, nullable: true }
    QsoCorrection:
      type: object
      required:
        [id, qsoId, requestedBy, reason, proposedValues, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        qsoId: { type: string, format: uuid }
        requestedBy: { type: string }
        reason: { type: string }
        proposedValues: { type: object, additionalProperties: true }
        status: { type: string, enum: [PENDING, APPLIED, REJECTED] }
        reviewedBy: { type: string, nullable: true }
        reviewNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time, nullable: true }
    AwardCondition:
      description: Programme-owned recursive AND/OR condition tree.
      oneOf:
        - type: object
          required: [kind, conditions]
          properties:
            kind: { type: string, enum: [AND, OR, ALL, ANY] }
            conditions:
              {
                type: array,
                items: { $ref: '#/components/schemas/AwardCondition' },
                minItems: 1,
              }
        - type: object
          required: [kind, operator, value]
          properties:
            kind:
              {
                type: string,
                enum:
                  [
                    QSO_COUNT,
                    ACTIVATION_COUNT,
                    UNIQUE_CALLSIGNS,
                    UNIQUE_ENTITIES,
                    FIELD,
                  ],
              }
            field: { type: string }
            operator: { type: string, enum: [GTE, GT, EQ, LTE, LT] }
            value: { type: number }
        - type: object
          required: [kind, values]
          properties:
            kind: { type: string, enum: [ENTITY_TYPE] }
            values: { type: array, items: { type: string }, minItems: 1 }
        - type: object
          required: [kind, condition]
          properties:
            kind: { type: string, enum: [NOT] }
            condition: { $ref: '#/components/schemas/AwardCondition' }
    AwardLevel:
      type: object
      required: [id, name, threshold]
      properties:
        id: { type: string }
        name: { type: string }
        threshold: { type: number, exclusiveMinimum: 0 }
    AwardAsset:
      type: object
      required: [kind, name, objectKey, mediaType, widthPx, heightPx]
      properties:
        assetId: { type: string, format: uuid }
        kind: { type: string, enum: [BACKGROUND, SIGNATURE] }
        name: { type: string }
        objectKey: { type: string }
        mediaType: { type: string, pattern: '^image/' }
        widthPx: { type: integer, minimum: 1 }
        heightPx: { type: integer, minimum: 1 }
        sha256: { type: string }
        bucket:
          type: string
          readOnly: true
          description: Server-selected bucket determined by asset kind and storage configuration.
    AwardAssetContent:
      type: object
      required: [asset, mediaType, contentBase64]
      properties:
        asset: { $ref: '#/components/schemas/AwardAsset' }
        mediaType: { type: string, enum: [image/png, image/jpeg] }
        contentBase64: { type: string, contentEncoding: base64 }
    AwardPreviewRequest:
      type: object
      required: [name, printSpec, template]
      properties:
        name: { type: string, maxLength: 200 }
        backgroundAsset: { $ref: '#/components/schemas/AwardAsset' }
        signatureAssetId: { type: string, format: uuid }
        managerName: { type: string, maxLength: 200 }
        awardText: { type: string, maxLength: 200 }
        printSpec: { $ref: '#/components/schemas/AwardPrintSpec' }
        template: { $ref: '#/components/schemas/AwardTemplate' }
      description: Registered artwork only, or blank paper when backgroundAsset is omitted; preview resolution is bounded to 150–300 DPI.
    AwardPreview:
      type: object
      required: [preview, mediaType, filename, contentBase64, mockData]
      properties:
        preview: { type: boolean, const: true }
        mediaType: { type: string, const: application/pdf }
        filename: { type: string }
        contentBase64: { type: string, contentEncoding: base64 }
        mockData: { type: object, readOnly: true }
    AwardTemplateElement:
      type: object
      required: [kind, x, y, width, height]
      properties:
        kind:
          {
            type: string,
            enum:
              [
                AWARD_NAME,
                CALLSIGN,
                PERSON_NAME,
                DATE_OBTAINED,
                MANAGER_NAME,
                MANAGER_SIGNATURE,
                AWARD_TEXT,
                CUSTOM_TEXT,
              ],
          }
        label:
          {
            type: string,
            maxLength: 200,
            description: Required text for CUSTOM_TEXT; optional display label for semantic fields.,
          }
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, exclusiveMinimum: 0, maximum: 1 }
        height: { type: number, exclusiveMinimum: 0, maximum: 1 }
        style: { type: object }
    AwardTemplate:
      type: object
      required: [elements]
      properties:
        elements:
          {
            type: array,
            minItems: 6,
            items: { $ref: '#/components/schemas/AwardTemplateElement' },
          }
    AwardPrintSpec:
      type: object
      properties:
        page: { type: string, enum: [A4, LETTER], default: A4 }
        orientation:
          { type: string, enum: [PORTRAIT, LANDSCAPE], default: PORTRAIT }
        dpi: { type: integer, minimum: 150, maximum: 300, default: 300 }
    AwardDefinition:
      type: object
      required:
        [
          programmeSlug,
          code,
          name,
          category,
          condition,
          levels,
          backgroundAsset,
          template,
        ]
      properties:
        awardId: { type: string, format: uuid }
        programmeSlug: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        awardText: { type: string, maxLength: 200, default: '' }
        version: { type: integer, minimum: 1, readOnly: true }
        revisionOf: { type: string, format: uuid, readOnly: true }
        expectedVersion:
          {
            type: integer,
            minimum: 1,
            description: Required when creating a draft from a published award version.,
          }
        category: { type: string, enum: [HUNTER, ACTIVATOR] }
        achievementMetric:
          {
            type: string,
            enum:
              [QSO_COUNT, ACTIVATION_COUNT, UNIQUE_CALLSIGNS, UNIQUE_ENTITIES],
          }
        condition: { $ref: '#/components/schemas/AwardCondition' }
        levels:
          {
            type: array,
            minItems: 1,
            items: { $ref: '#/components/schemas/AwardLevel' },
          }
        backgroundAsset: { $ref: '#/components/schemas/AwardAsset' }
        signatureAssetId: { type: [string, 'null'], format: uuid }
        managerName: { type: string }
        effectiveFrom: { type: [string, 'null'], format: date-time }
        printSpec: { $ref: '#/components/schemas/AwardPrintSpec' }
        template: { $ref: '#/components/schemas/AwardTemplate' }
    AwardReview:
      type: object
      required: [decision, reviewerId]
      properties:
        decision: { type: string, enum: [APPROVED, CHANGES_REQUESTED] }
        reviewerId: { type: string }
        note: { type: string }
    AwardPublication:
      type: object
      required: [effectiveFrom, publisherId]
      properties:
        effectiveFrom: { type: string, format: date-time }
        publisherId: { type: string }
    AwardEvaluationRequest:
      type: object
      required: [awardId, subjectId, facts]
      properties:
        awardId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        facts: { type: object, additionalProperties: true }
    AwardEvaluationJobRequest:
      type: object
      required: [awardId, subjectId]
      properties:
        awardId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        facts:
          {
            type: object,
            additionalProperties: true,
            description: Optional reproducible fact snapshot; omitted values are read from aggregates.,
          }
    AwardProgressRequest:
      type: object
      required: [awardId, subjectId]
      properties:
        awardId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
    AwardRequest:
      type: object
      required: [awardId, levelId, subjectId, callsign, personName]
      properties:
        awardId: { type: string, format: uuid }
        levelId: { type: string }
        subjectId: { type: string, format: uuid }
        callsign: { type: string }
        personName: { type: string }
        facts:
          {
            type: object,
            additionalProperties: true,
            description: Optional facts for trusted service/admin callers; participant requests use server-side activity facts.,
          }
    AwardIssuanceRequest:
      type: object
      required: [managerName, signatureAssetId]
      properties:
        managerName: { type: string }
        signatureAssetId: { type: string, format: uuid }
        dateObtained: { type: string, format: date-time }
    AssetContent:
      type: object
      required: [contentBase64]
      properties:
        contentBase64: { type: string, contentEncoding: base64 }
