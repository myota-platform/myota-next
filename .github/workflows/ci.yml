name: Node CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      geo-db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: myota_geo
          POSTGRES_USER: myota
          POSTGRES_PASSWORD: myota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myota -d myota_geo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CORE_DATABASE_URL: postgresql://myota:myota@127.0.0.1:5432/myota_core
      ACTIVITY_DATABASE_URL: postgresql://myota:myota@127.0.0.1:5432/myota_activity
      GEO_DATABASE_URL: postgresql://myota:myota@127.0.0.1:5432/myota_geo
      GEO_PARITY_DATABASE_URL: postgresql://myota:myota@127.0.0.1:5432/myota_geo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install OSM PBF decoder
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes osmium-tool
      - run: npm ci
      - run: npm run prepare:parity-databases
      - run: npm run migrate:db -- --owner=core
      - run: npm run migrate:db -- --owner=activity
      - run: npm run migrate:db -- --owner=geo
      - run: npm run test:geodata-maidenhead
      - run: npm run test:transfer-ledger
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix web/admin
      - run: npm run lint --prefix web/admin
      - run: npm run typecheck --prefix web/admin
      - run: npm run build --prefix web/admin
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
