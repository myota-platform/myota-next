{{- range $name, $component := .Values.components }}
{{- if $component.enabled }}
{{- $imageName := $component.app }}
{{- $usesObserve := true }}
{{- if hasKey $component "observe" }}
{{- $usesObserve = $component.observe }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (include "myota-next.name" $) $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "myota-next.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ default 1 $component.replicas }}
  strategy:
    {{- toYaml $.Values.deploymentStrategy | nindent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "myota-next.podLabels" (dict "Values" $.Values "Release" $.Release "Chart" $.Chart "component" $name) | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ default 30 $component.terminationGracePeriodSeconds }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "myota-next.image" (dict "image" (index $.Values.images $imageName) "name" $imageName) | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          {{- with $.Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $component.port }}
          ports:
            - name: http
              containerPort: {{ $component.port }}
              protocol: TCP
          {{- else if $component.healthPort }}
          ports:
            - name: health
              containerPort: {{ $component.healthPort }}
              protocol: TCP
          {{- end }}
          env:
            {{- include "myota-next.env" (dict "root" $ "env" $component.env "observe" (and $.Values.observe.enabled $usesObserve)) | nindent 12 }}
            {{- if eq $name "geodata-worker" }}
            {{- include "myota-next.geodata-worker-policy-env" $ | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml (default $.Values.commonResources $component.resources) | nindent 12 }}
          {{- if or $component.port $component.healthPort }}
          livenessProbe:
            httpGet:
              path: {{ default "/healthz" $component.livenessPath }}
              port: {{ ternary "http" "health" (hasKey $component "port") }}
            {{- toYaml $.Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ default "/readyz" $component.readinessPath }}
              port: {{ ternary "health" "http" (hasKey $component "healthPort") }}
            {{- toYaml $.Values.probes.readiness | nindent 12 }}
          {{- end }}
---
{{- end }}
{{- end }}
