name: Node CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'ref' }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, test, and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      geo-db:
        image: postgis/postgis:16-3.6-alpine@sha256:a8ae5aac22bfe4b734c1fa0644ca18039a1e6bd7105c5aa9308cd24bfa1b2ef7
        env:
          POSTGRES_DB: myota_geo
          POSTGRES_USER: myota
          POSTGRES_PASSWORD: myota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myota -d myota_geo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CORE_DATABASE_URL: postgresql://myota:myota@127.0.0.1:5432/myota_core
      ACTIVITY_DATABASE_URL: postgresql://myota:myota@127.0.0.1:5432/myota_activity
      GEO_DATABASE_URL: postgresql://myota:myota@127.0.0.1:5432/myota_geo
      GEO_PARITY_DATABASE_URL: postgresql://myota:myota@127.0.0.1:5432/myota_geo
      NATS_URL: nats://127.0.0.1:14222
      NATS_TEST_URL: nats://127.0.0.1:14222
      ACTIVITY_NOTIFICATION_METRICS_PORT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate Helm chart and testing routes
        run: |
          helm lint deploy/helm/myota-next -f deploy/helm/myota-next/values-testing.yaml
          helm lint deploy/helm/myota-infrastructure \
            --set objectStorage.enabled=true \
            --set objectStorage.provisionerImage=ghcr.io/myota-platform/myota-next-tools:ci
          helm template myota-test deploy/helm/myota-next \
            --namespace myota-test \
            -f deploy/helm/myota-next/values-testing.yaml \
            > "$RUNNER_TEMP/myota-test-rendered.yaml"
          grep -F 'Host(`myota-test.spainip.es`)' "$RUNNER_TEMP/myota-test-rendered.yaml"
          grep -F 'Host(`myota-admin-test.spainip.es`)' "$RUNNER_TEMP/myota-test-rendered.yaml"
          grep -F 'Host(`myota-participant-test.spainip.es`)' "$RUNNER_TEMP/myota-test-rendered.yaml"
          grep -F 'certResolver: "acmeresolver"' "$RUNNER_TEMP/myota-test-rendered.yaml"
      - name: Install OSM PBF decoder for correctness fixtures
        run: >-
          sudo timeout 6m apt-get -o Acquire::Retries=3
          -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          && sudo timeout 6m apt-get -o Acquire::Retries=3
          -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install
          --no-install-recommends --yes osmium-tool
      - name: Start isolated JetStream
        run: |
          docker run --detach --name myota-ci-nats \
            --publish 14222:4222 --publish 18222:8222 \
            nats:2.14.8-alpine3.22@sha256:fce5fbf8b29ee0baa790e67bcd4abafebdd97363aa025f7d46a17489df002e30 -js -p 4222 -m 8222
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18222/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs myota-ci-nats
          exit 1
      - run: npm ci
      - run: npm run audit:dependencies
      - name: Scan tracked source and production dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Audit GitHub Actions workflows
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir zizmor==1.31.1
          zizmor .github/workflows
      - name: Provision bounded JetStream topology for CI
        run: npm run provision:jetstream
        env:
          NATS_TOPOLOGY_APPLY: '1'
          NATS_EVENTS_MAX_BYTES: '16777216'
          NATS_EVENTS_MAX_MESSAGES: '10000'
          NATS_EVENTS_MAX_MESSAGE_BYTES: '1048576'
          NATS_ACTIVITY_WORK_MAX_AGE_SECONDS: '86400'
          NATS_ACTIVITY_WORK_MAX_BYTES: '16777216'
          NATS_ACTIVITY_WORK_MAX_MESSAGES: '10000'
          NATS_ACTIVITY_WORK_MAX_MESSAGE_BYTES: '1048576'
          NATS_GEODATA_WORK_MAX_AGE_SECONDS: '86400'
          NATS_GEODATA_WORK_MAX_BYTES: '16777216'
          NATS_GEODATA_WORK_MAX_MESSAGES: '10000'
          NATS_GEODATA_WORK_MAX_MESSAGE_BYTES: '1048576'
          NATS_EMAIL_WORK_MAX_AGE_SECONDS: '86400'
          NATS_EMAIL_WORK_MAX_BYTES: '16777216'
          NATS_EMAIL_WORK_MAX_MESSAGES: '10000'
          NATS_EMAIL_WORK_MAX_MESSAGE_BYTES: '1048576'
      - run: npm run prepare:parity-databases
      - run: npm run migrate:db -- --owner=core
      - run: npm run migrate:db -- --owner=activity
      - run: npm run migrate:db -- --owner=geo
      - run: npm run test:geodata-maidenhead
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - run: npm ci --prefix web/admin
      - run: npm run lint --prefix web/admin
      - run: npm run typecheck --prefix web/admin
      - run: npm run build --prefix web/admin
      - run: npx playwright install chromium
      - run: npm run test:browser
        env:
          MYOTA_BROWSER_GEODATA_WORKERS: '1'
          MYOTA_BROWSER_ACTIVITY_WORKERS: '1'
