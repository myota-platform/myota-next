      summary: Publish an approved award with an effective date
      parameters: [{ $ref: '#/components/parameters/AwardId' }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/AwardPublication' } },
