apiVersion: catalog.cattle.io/v1
kind: App
metadata:
  name: myota-test
  namespace: myota-test
spec:
  values:
    activityLimits:
      maxBatchQsos: 5000
      uploadMaxBytes: 26214400
    buildVersion: testing-492a44b
    commonResources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 96Mi
    components:
      activity-worker:
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
      email-worker:
        enabled: true
        env:
          NODE_EXTRA_CA_CERTS: /run/myota-smtp-ca/ca.crt
        extraVolumeMounts:
          - mountPath: /run/myota-smtp-ca
            name: smtp-ca
            readOnly: true
        extraVolumes:
          - name: smtp-ca
            secret:
              items:
                - key: ca.crt
                  path: ca.crt
              secretName: myota-smtp-qualification-server
      geodata:
        env:
          MYOTA_LOAD_TEST_CLEANUP_ENABLED: "1"
      geodata-importer:
        enabled: false
      geodata-worker:
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
      identity:
        env:
          MYOTA_PARTICIPANT_PUBLIC_URL: https://myota-participant-test.spainip.es
      participant-web: {}
    databasePools:
      activity: 12
      core: 10
      geodata: 10
    dependencies:
      clamavUrl: ""
      grafanaUpstream: kube-prometheus-stack-grafana.cattle-monitoring-system.svc.cluster.local:80
      objectStorageEndpoint: http://myota-test-seaweedfs:8333
      objectStoragePublicEndpoint: https://myota-s3-test.spainip.es
      smtp:
        host: myota-test-smtp-sink.myota-test.svc.cluster.local
        port: "1025"
        senderAddress: qualification@myota.test
        senderDisplayName: MyOTA SMTP Qualification
        timeoutSeconds: "10"
        tlsMode: starttls
        username: qualification
    environment: testing
    geodataImporter:
      sourceAllowlist: []
      sourceMaxBytes: 33554432
    geodataWorker:
