imagePullPolicy: IfNotPresent
postgresSecret: myota-postgres-auth
storageClassName: ''
resources: {}

# Keep exactly these three databases. Email delivery is owned by Core.
databases:
  core:
    name: myota_core
    image: postgres:16-alpine
    storage: 10Gi
  activity:
    name: myota_activity
    image: postgres:16-alpine
    storage: 20Gi
  geo:
    name: myota_geo
    image: postgis/postgis:16-3.4
    storage: 50Gi
